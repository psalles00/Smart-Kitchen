name: SmartKitchen
options:
  bundleIdPrefix: com.smartkitchen
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  useBaseInternationalization: true

settings:
  base:
    DEVELOPMENT_LANGUAGE: pt-BR
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "6.0"

targets:
  SmartKitchen:
    type: application
    supportedDestinations: [iOS, macOS]
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: Shared
      - path: SmartKitchen
        excludes:
          - App/BackupSettingsView.swift
          - App/StatusBarStyleView.swift
      - path: icons
        includes:
          - meta-*.json
        buildPhase: resources
      - path: icons/images-128
        type: folder
    info:
      path: SmartKitchen/Resources/Info.plist
      properties:
        OpenAIAPIKey: $(OPENAI_API_KEY)
        OpenRouterAPIKey: $(OPENROUTER_API_KEY)
        ExaAPIKey: $(EXA_API_KEY)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UIAppFonts:
          - PlayfairDisplay.ttf
          - PlayfairDisplay-Italic.ttf
          - Boska-Black.otf
          - Boska-Medium.otf
          - Boska-Regular.otf
          - Boska-Light.otf
          - BricolageGrotesque-Variable.ttf
        ATSApplicationFontsPath: "."
        UILaunchScreen: {}
        NSCameraUsageDescription: O Smart Kitchen usa a câmera para tirar fotos das suas receitas e refeições.
        NSPhotoLibraryUsageDescription: O Smart Kitchen acessa a galeria para anexar fotos às suas receitas.
        NSMicrophoneUsageDescription: O Smart Kitchen usa o microfone para registrar refeições por voz.
        NSSpeechRecognitionUsageDescription: O Smart Kitchen usa reconhecimento de voz para transcrever o que você falou sobre sua refeição.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.pedrosalles.smartkitchen.import
            CFBundleURLSchemes:
              - smartkitchen
            CFBundleTypeRole: Viewer
        CFBundleLocalizations:
          - pt-BR
          - en
          - es
          - fr
          - de
          - it
          - ja
    entitlements:
      path: SmartKitchen/SmartKitchen.entitlements
    capabilities:
      - iCloud:
          cloudKit: true
        containerIdentifiers: [iCloud.com.pedrosalles.smartkitchen.syn, iCloud.com.pedrosalles.smartkitchen.sync]
      - pushNotifications: {}
      - backgroundModes:
          modes: [remote-notification]
    dependencies:
      - target: SmartKitchenShareExtension
        embed: true
        codeSign: true
        platformFilter: iOS
      - target: SmartKitchenWidgets
        embed: true
        codeSign: true
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync
        DEVELOPMENT_TEAM: 44K57HQAP9
        MARKETING_VERSION: "3.2.6"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
      gatherCoverageData: false

  SmartKitchenShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: SmartKitchenShareExtension
    info:
      path: SmartKitchenShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Smart Kitchen
        CFBundleLocalizations:
          - pt-BR
          - en
          - es
          - fr
          - de
          - it
          - ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: SmartKitchenShareExtension/SmartKitchenShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pedrosalles.smartkitchen.sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync.ShareExtension
        DEVELOPMENT_TEAM: 44K57HQAP9
        MARKETING_VERSION: "3.2.6"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  SmartKitchenWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: SmartKitchenWidgets
    info:
      path: SmartKitchenWidgets/Info.plist
      properties:
        CFBundleDisplayName: Smart Kitchen
        CFBundleLocalizations:
          - pt-BR
          - en
          - es
          - fr
          - de
          - it
          - ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync.Widgets
        DEVELOPMENT_TEAM: 44K57HQAP9
        MARKETING_VERSION: "3.2.6"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
