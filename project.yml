name: SmartKitchen
options:
  bundleIdPrefix: com.smartkitchen
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  useBaseInternationalization: true

settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "6.0"

schemes:
  Savoria:
    build:
      targets:
        Savoria: all
    test:
      config: Debug
      gatherCoverageData: false
      macroExpansion: Savoria
      targets:
        - SavoriaTests
    run:
      config: Release
      debugEnabled: false
      executable: Savoria
      storeKitConfiguration: SmartKitchen/Resources/Configuration.storekit
      simulateLocation:
        allow: true
    profile:
      config: Release
      executable: Savoria
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
    management:
      shared: true

targets:
  Savoria:
    type: application
    supportedDestinations: [iOS, macOS]
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: Shared
      - path: SmartKitchen
        excludes:
          - App/StatusBarStyleView.swift
      - path: icons
        includes:
          - meta-*.json
        buildPhase: resources
      - path: icons/images-128
        type: folder
    info:
      path: SmartKitchen/Resources/Info.plist
      properties:
        SupabaseURL: https://yfcmvdijvgeaihvwyssb.supabase.co
        SupabaseAnonKey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmY212ZGlqdmdlYWlodnd5c3NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODAwMjEsImV4cCI6MjA5MjQ1NjAyMX0.Ffpszze5umpURnzNL_Fl3u7SFmjb_opQmWVPdpUjhiI
        UIAppFonts:
          - PlayfairDisplay.ttf
          - PlayfairDisplay-Italic.ttf
          - Boska-Black.otf
          - Boska-Medium.otf
          - Boska-Regular.otf
          - Boska-Light.otf
          - BricolageGrotesque-Variable.ttf
        ATSApplicationFontsPath: "."
        UILaunchScreen: {}
        CFBundleDisplayName: Savoria
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: O Savoria usa a câmera para tirar fotos das suas receitas e refeições.
        NSPhotoLibraryUsageDescription: O Savoria acessa a galeria para anexar fotos às suas receitas.
        NSMicrophoneUsageDescription: O Savoria usa o microfone para registrar refeições por voz.
        NSSpeechRecognitionUsageDescription: O Savoria usa reconhecimento de voz para transcrever o que você falou sobre sua refeição.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.pedrosalles.smartkitchen.import
            CFBundleURLSchemes:
              - smartkitchen
            CFBundleTypeRole: Viewer
        CFBundleLocalizations:
          - en
          - pt-BR
          - es
          - fr
          - de
          - it
          - ja
    entitlements:
      path: SmartKitchen/SmartKitchen.entitlements
      properties:
        aps-environment: development
        com.apple.developer.aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.pedrosalles.smartkitchen.syn
          - iCloud.com.pedrosalles.smartkitchen.sync
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.pedrosalles.smartkitchen.syn
          - iCloud.com.pedrosalles.smartkitchen.sync
        com.apple.security.application-groups:
          - group.com.pedrosalles.smartkitchen.sync
    capabilities:
      - iCloud:
          cloudKit: true
        containerIdentifiers: [iCloud.com.pedrosalles.smartkitchen.syn, iCloud.com.pedrosalles.smartkitchen.sync]
      - pushNotifications: {}
      - backgroundModes:
          modes: [remote-notification]
    dependencies:
      - target: SavoriaShareExtension
        embed: true
        codeSign: true
        platformFilter: iOS
      - target: SavoriaWidgets
        embed: true
        codeSign: true
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync
        DEVELOPMENT_TEAM: 44K57HQAP9
        MARKETING_VERSION: "3.6.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  SavoriaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SmartKitchenTests
    dependencies:
      - target: Savoria
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync.tests
        DEVELOPMENT_TEAM: 44K57HQAP9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Savoria.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Savoria"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SavoriaShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: SmartKitchenShareExtension
    info:
      path: SmartKitchenShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Savoria
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - pt-BR
          - es
          - fr
          - de
          - it
          - ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: SmartKitchenShareExtension/SmartKitchenShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pedrosalles.smartkitchen.sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync.ShareExtension
        DEVELOPMENT_TEAM: 44K57HQAP9
        MARKETING_VERSION: "3.6.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  SavoriaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: SmartKitchenWidgets
    info:
      path: SmartKitchenWidgets/Info.plist
      properties:
        CFBundleDisplayName: Savoria
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - pt-BR
          - es
          - fr
          - de
          - it
          - ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync.Widgets
        DEVELOPMENT_TEAM: 44K57HQAP9
        MARKETING_VERSION: "3.6.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
