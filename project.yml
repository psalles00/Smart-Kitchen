name: SmartKitchen
options:
  bundleIdPrefix: com.smartkitchen
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  SmartKitchen:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SmartKitchen
        excludes:
          - App/BackupSettingsView.swift
          - App/StatusBarStyleView.swift
      - path: icons/images-128
        type: folder
    info:
      path: SmartKitchen/Resources/Info.plist
      properties:
        UIAppFonts:
          - PlayfairDisplay.ttf
          - PlayfairDisplay-Italic.ttf
          - Boska-Black.otf
          - Boska-Medium.otf
          - Boska-Regular.otf
          - Boska-Light.otf
        ATSApplicationFontsPath: "."
        UILaunchScreen: {}
        NSCameraUsageDescription: O Smart Kitchen usa a câmera para tirar fotos das suas receitas.
        NSPhotoLibraryUsageDescription: O Smart Kitchen acessa a galeria para anexar fotos às suas receitas.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: SmartKitchen/SmartKitchen.entitlements
    capabilities:
      - iCloud:
          cloudKit: true
          containerIdentifiers: [iCloud.com.pedrosalles.smartkitchen.sync]
      - pushNotifications: {}
      - backgroundModes:
          modes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync
        DEVELOPMENT_TEAM: 5KSM738734
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
      gatherCoverageData: false
