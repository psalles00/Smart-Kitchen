name: SmartKitchen
options:
  bundleIdPrefix: com.smartkitchen
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  SmartKitchen:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SmartKitchen
        excludes:
          - App/BackupSettingsView.swift
          - App/StatusBarStyleView.swift
      - path: icons/images-128
        type: folder
    info:
      path: SmartKitchen/Resources/Info.plist
      properties:
        UIAppFonts:
          - PlayfairDisplay.ttf
          - PlayfairDisplay-Italic.ttf
          - Boska-Black.otf
          - Boska-Medium.otf
          - Boska-Regular.otf
          - Boska-Light.otf
          - BricolageGrotesque-Variable.ttf
        ATSApplicationFontsPath: "."
        UILaunchScreen: {}
        NSCameraUsageDescription: O Smart Kitchen usa a câmera para tirar fotos das suas receitas e refeições.
        NSPhotoLibraryUsageDescription: O Smart Kitchen acessa a galeria para anexar fotos às suas receitas.
        NSMicrophoneUsageDescription: O Smart Kitchen usa o microfone para registrar refeições por voz.
        NSSpeechRecognitionUsageDescription: O Smart Kitchen usa reconhecimento de voz para transcrever o que você falou sobre sua refeição.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.pedrosalles.smartkitchen.import
            CFBundleURLSchemes:
              - smartkitchen
            CFBundleTypeRole: Viewer
    entitlements:
      path: SmartKitchen/SmartKitchen.entitlements
    capabilities:
      - iCloud:
          cloudKit: true
        containerIdentifiers: [iCloud.com.pedrosalles.smartkitchen.sync, iCloud.com.pedrosalles.smartkitchen.syn]
      - pushNotifications: {}
      - backgroundModes:
          modes: [remote-notification]
    dependencies:
      - target: SmartKitchenShareExtension
        embed: true
        codeSign: true
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync
        DEVELOPMENT_TEAM: 5KSM738734
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
      gatherCoverageData: false

  SmartKitchenShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SmartKitchenShareExtension
    info:
      path: SmartKitchenShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Smart Kitchen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: SmartKitchenShareExtension/SmartKitchenShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedrosalles.smartkitchen.sync.ShareExtension
        DEVELOPMENT_TEAM: 5KSM738734
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
